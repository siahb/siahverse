<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | Siahverse</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/shared-theme.css?v=account"><script src="/toggle-theme.js?v=account"></script><script src="/account-client.js?v=account"></script><style>
:root{--bg:#090d17;--panel:#111827;--panel2:#172033;--text:#f4f7ff;--muted:#aeb8cf;--border:#2b3957;--accent:#7c9cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui;min-height:100vh}main{max-width:480px;margin:40px auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}a{color:var(--accent)}h1{font-size:32px}.muted{color:var(--muted);line-height:1.6}label{display:grid;gap:8px;margin:18px 0}input,button{font:inherit;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--panel2);color:var(--text)}button{cursor:pointer}button:disabled{opacity:.5}#submit{width:100%;background:var(--accent);color:#090d17;font-weight:700}.modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}#status{line-height:1.6}[hidden]{display:none!important}nav{display:grid;gap:14px;margin:24px 0}</style></head><body><main><div class="top"><a href="/">← Siahverse</a><button id="sharedThemeToggle" class="shared-theme-toggle">Theme</button></div><h1 id="heading">Sign in</h1><p class="muted">One account for your Siahverse apps. Exam access is separate.</p><section id="signedIn" hidden><p id="email"></p><nav><a href="/nursedoku/">NurseDoku</a><a href="https://todo.siahverse.cc/">Tasks</a><a href="https://nextset.siahverse.cc/">NextSet</a></nav><button data-mode="update">Change password</button> <button id="signout">Sign out of Siahverse</button></section><form id="form"><label id="emailRow">Email<input id="emailInput" type="email" autocomplete="email" required></label><label id="passwordRow">Password<input id="password" type="password" autocomplete="current-password" required></label><button id="submit">Sign in</button></form><p id="status" role="status"></p><div class="modes"><button data-mode="signin">Sign in</button><button data-mode="signup">Create account</button><button data-mode="recover">Forgot password?</button></div><script>
const $=id=>document.getElementById(id),auth=window.SiahverseAccount.auth;let mode=new URLSearchParams(location.search).get('mode')==='update'?'update':'signin';
function draw(session){$('signedIn').hidden=!session||mode==='update';$('form').hidden=!!session&&mode!=='update';$('email').textContent=session?'Signed in as '+session.user.email:'';$('heading').textContent=mode==='signup'?'Create account':mode==='recover'?'Reset password':mode==='update'?'New password':session?'Your account':'Sign in';$('emailRow').hidden=mode==='update';$('emailInput').required=mode!=='update';$('passwordRow').hidden=mode==='recover';$('password').required=mode!=='recover';$('password').minLength=mode==='signup'||mode==='update'?10:1;$('password').autocomplete=mode==='signin'?'current-password':'new-password';$('submit').textContent=mode==='signup'?'Create account':mode==='recover'?'Send reset link':mode==='update'?'Save password':'Sign in';}
auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')mode='update';draw(session);});
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=async()=>{mode=button.dataset.mode;$('status').textContent='';$('password').value='';const {data}=await auth.getSession();draw(data.session);});
$('form').onsubmit=async event=>{event.preventDefault();$('submit').disabled=true;const email=$('emailInput').value.trim(),password=$('password').value;const r=mode==='signin'?await auth.signInWithPassword({email,password}):mode==='signup'?await auth.signUp({email,password}):mode==='recover'?await auth.resetPasswordForEmail(email):await auth.updateUser({password});$('password').value='';$('submit').disabled=false;$('status').textContent=r.error?r.error.message:mode==='signup'?'Check your email to confirm your account.':mode==='recover'?'If the address has an account, a reset link will arrive shortly.':mode==='update'?'Password updated.':'Signed in.';if(mode==='update'&&!r.error){mode='signin';const {data}=await auth.getSession();draw(data.session);}};
$('signout').onclick=async()=>{const r=await auth.signOut();$('status').textContent=r.error?r.error.message:'Signed out.';};
window.SiahverseAccount.ready.catch(error=>$('status').textContent=error.message);
</script></main></body></html>
