<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Account | Siahverse</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/shared-theme.css?v=account">
  <link rel="stylesheet" href="/account/account.css?v=20261001-icons">
  <script src="/toggle-theme.js?v=20261001-icons"></script>
  <script src="/account-client.js?v=account"></script>
  <script src="/account/account.js?v=20261001-icons" defer></script>
</head>
<body>
  <main>
    <header class="top"><a class="home" href="/"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5m6-6-6 6 6 6"/></svg> Siahverse</a><button id="sharedThemeToggle" class="shared-theme-toggle" type="button">Theme</button></header>
    <article class="account-card">
      <div class="intro"><p class="eyebrow">SIAHVERSE ACCOUNT</p><h1 id="heading">Sign in</h1><p id="description" class="muted">Use your account for NurseDoku, Tasks, and NextSet.</p></div>
      <section id="signedIn" hidden aria-label="Account details">
        <div class="identity"><span class="avatar" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span><div><span class="identity-label">Email address</span><p id="email"></p></div><span class="badge">Signed in</span></div>
        <h2>Your apps</h2>
        <nav class="apps" aria-label="Your apps">
          <a href="/nursedoku/"><span class="app-icon nurse" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6Z"/></svg></span><span><strong>NurseDoku</strong><small>Nursing games</small></span><span class="arrow" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 3h7v7m0-7L10 14M10 3H3v18h18v-7"/></svg></span></a>
          <a href="https://todo.siahverse.cc/"><span class="app-icon tasks" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 12 4 4L19 6"/></svg></span><span><strong>Tasks</strong><small>Lists and reminders</small></span><span class="arrow" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 3h7v7m0-7L10 14M10 3H3v18h18v-7"/></svg></span></a>
          <a href="https://nextset.siahverse.cc/"><span class="app-icon nextset" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M3 8l5-5m8 18 5-5M2 5l3-3m14 20 3-3M5 11l6-6m2 14 6-6"/></svg></span><span><strong>NextSet</strong><small>Workout tracking</small></span><span class="arrow" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 3h7v7m0-7L10 14M10 3H3v18h18v-7"/></svg></span></a>
        </nav>
        <div class="settings"><div><h2>Password</h2><p class="muted">Update your account password.</p></div><button data-mode="update" type="button">Change password</button></div>
        <div class="signout-row"><button id="signout" class="text-button" type="button">Sign out</button></div>
      </section>
      <form id="form">
        <label id="emailRow" for="emailInput">Email<input id="emailInput" type="email" autocomplete="email" placeholder="you@example.com" required></label>
        <label id="passwordRow" for="password">Password<input id="password" type="password" autocomplete="current-password" required><small id="passwordHint" class="muted" hidden>At least 10 characters.</small></label>
        <button id="submit" class="primary" type="submit">Sign in</button>
      </form>
      <p id="status" role="status" hidden></p>
      <div id="modes" class="modes" aria-label="Account options">
        <button data-mode="signin" class="text-button" type="button" hidden>Back to sign in</button>
        <button data-mode="signup" class="text-button" type="button">Create account</button>
        <button data-mode="recover" class="text-button" type="button">Forgot password?</button>
      </div>
      <button id="back" class="text-button back" type="button" hidden><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5m6-6-6 6 6 6"/></svg> Back to account</button>
    </article>
    <footer>Exam access is managed separately.</footer>
  </main>
</body>
</html>
