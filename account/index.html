<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Account | Siahverse</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/shared-theme.css?v=account">
  <link rel="stylesheet" href="/account/account.css?v=20261001">
  <script src="/toggle-theme.js?v=account"></script>
  <script src="/account-client.js?v=account"></script>
  <script src="/account/account.js?v=20261001" defer></script>
</head>
<body>
  <main>
    <header class="top"><a class="home" href="/">← Siahverse</a><button id="sharedThemeToggle" class="shared-theme-toggle" type="button">Theme</button></header>
    <article class="account-card">
      <div class="intro"><p class="eyebrow">SIAHVERSE ACCOUNT</p><h1 id="heading">Sign in</h1><p id="description" class="muted">Use your account for NurseDoku, Tasks, and NextSet.</p></div>
      <section id="signedIn" hidden aria-label="Account details">
        <div class="identity"><span class="avatar" aria-hidden="true">◎</span><div><span class="identity-label">Email address</span><p id="email"></p></div><span class="badge">Signed in</span></div>
        <h2>Your apps</h2>
        <nav class="apps" aria-label="Your apps">
          <a href="/nursedoku/"><span class="app-icon nurse" aria-hidden="true">✚</span><span><strong>NurseDoku</strong><small>Nursing games</small></span><span class="arrow" aria-hidden="true">↗</span></a>
          <a href="https://todo.siahverse.cc/"><span class="app-icon tasks" aria-hidden="true">✓</span><span><strong>Tasks</strong><small>Lists and reminders</small></span><span class="arrow" aria-hidden="true">↗</span></a>
          <a href="https://nextset.siahverse.cc/"><span class="app-icon nextset" aria-hidden="true">↗</span><span><strong>NextSet</strong><small>Workout tracking</small></span><span class="arrow" aria-hidden="true">↗</span></a>
        </nav>
        <div class="settings"><div><h2>Password</h2><p class="muted">Update your account password.</p></div><button data-mode="update" type="button">Change password</button></div>
        <div class="signout-row"><button id="signout" class="text-button" type="button">Sign out</button></div>
      </section>
      <form id="form">
        <label id="emailRow" for="emailInput">Email<input id="emailInput" type="email" autocomplete="email" placeholder="you@example.com" required></label>
        <label id="passwordRow" for="password">Password<input id="password" type="password" autocomplete="current-password" required><small id="passwordHint" class="muted" hidden>At least 10 characters.</small></label>
        <button id="submit" class="primary" type="submit">Sign in</button>
      </form>
      <p id="status" role="status" hidden></p>
      <div id="modes" class="modes" aria-label="Account options">
        <button data-mode="signin" class="text-button" type="button" hidden>Back to sign in</button>
        <button data-mode="signup" class="text-button" type="button">Create account</button>
        <button data-mode="recover" class="text-button" type="button">Forgot password?</button>
      </div>
      <button id="back" class="text-button back" type="button" hidden>← Back to account</button>
    </article>
    <footer>Exam access is managed separately.</footer>
  </main>
</body>
</html>
